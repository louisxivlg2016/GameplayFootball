<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameplayFootball — WebAssembly</title>
    <style>
      html, body { margin: 0; background: #0b0f14; color: #cdd6e0;
        font: 13px/1.5 ui-monospace, monospace; height: 100%; overflow: hidden; }
      #wrap { display: flex; height: 100vh; }
      #canvas { background: #000; display: block; margin: auto;
        max-width: 100%; max-height: 100vh; }
      #log { position: fixed; left: 0; bottom: 0; max-height: 38vh; width: 100%;
        overflow: auto; padding: 6px 10px; background: rgba(0,0,0,.72);
        white-space: pre-wrap; box-sizing: border-box; display: none; }
      /* the debug console is hidden by default; add ?debug=1 to the URL to show it */
      body.debug #log { display: block; }
      .err { color: #ff6b6b; } .ok { color: #6bd39a; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="canvas" width="1280" height="720" tabindex="-1"
        oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <div id="log"></div>
    <script>
      // debug console: hidden unless the page is opened with ?debug=1
      const gpfDebug = new URLSearchParams(location.search).get("debug") === "1";
      if (gpfDebug) document.body.classList.add("debug");
      const logEl = document.getElementById("log");
      const line = (s, cls) => {
        const d = document.createElement("div");
        if (cls) d.className = cls;
        d.textContent = s;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
      };
      window.__gpfLog = line;
      var Module = {
        canvas: document.getElementById("canvas"),
        print: (t) => { console.log(t); line(t); },
        printErr: (t) => { console.error(t); line(t, "err"); },
        setStatus: (t) => { if (t) line(t); },
        onAbort: (w) => line("ABORT: " + w, "err"),
      };
    </script>
    <!-- multi-language TTS radio commentary (installs window.gpfRadio* hooks the
         C++ engine calls); ?lang=xx picks the language, R toggles it -->
    <script type="module" src="/radio.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
